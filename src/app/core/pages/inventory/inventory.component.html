<div class="inventory-container">

  <!-- Page Header -->
  <div class="page-header">
    <div>
      <h2>Manage Inventory</h2>
      <p class="header-subtitle">Overview of the library's book collection and availability</p>
    </div>
  </div>

  <!-- Loading state -->
  <div *ngIf="loading" class="loading-state">
    <div class="spinner"></div>
    <span>Loading inventory…</span>
  </div>

  <!-- Content -->
  <div *ngIf="!loading" class="content">

    <!-- Actions Card -->
    <div class="actions-card">
      <h3 class="actions-title">Quick Actions</h3>
      <div class="actions-list">

        <div class="action-row">
          <div class="action-info">
            <span class="action-name">Update Inventory</span>
            <span class="action-desc">Adjust book counts and stock levels</span>
          </div>
          <button class="btn-submit" routerLink="/librarian/update-inventory">Update Inventory</button>
        </div>

        <div class="action-row">
          <div class="action-info">
            <span class="action-name">Manage Returns</span>
            <span class="action-desc">Process returned books and update availability</span>
          </div>
          <button class="btn-outline" routerLink="/librarian/manage-returns">Manage Returns</button>
        </div>

      </div>
    </div>

  </div>

</div>
